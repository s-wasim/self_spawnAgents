[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aae"
version = "3.0.0"
description = "Autonomous Agent Ecosystem (AAE) — V3.0"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "AAE Operator" }]
dependencies = [
    "pydantic>=2.8",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "httpx>=0.27",
    "typer>=0.12",
    "jinja2>=3.1",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "apscheduler>=3.10",
    "redis>=5.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "mypy>=1.10",
    "ruff>=0.5",
    "pre-commit>=3.7",
]
langgraph = [
    "langgraph>=1.1",
    "langgraph-checkpoint-postgres>=3.0",
]

[project.scripts]
aae-freeze = "aae.ops.freeze_experiment:app"
aae-day0 = "scripts.day0_bootstrap:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["aae*"]
exclude = ["tests*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
